<!-- Opening splash: drawn by the browser right away, before the app's
     scripts arrive (it used to be a blank gray screen for 1-2 s). It stays
     only until the app has drawn its first screen, then cross-fades away.
     No minimum time: a fast launch shows it briefly or not at all. -->
<style>
#haven-splash{position:fixed;inset:0;z-index:9999;background:#1C2B3A;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .3s ease}
#haven-splash.hs-out{opacity:0;pointer-events:none}
#haven-splash .hs-mark{color:#FFFFFF;font:800 22px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;letter-spacing:.42em;padding-left:.42em;opacity:0;animation:hsIn .7s ease .05s forwards}
#haven-splash .hs-note{position:absolute;left:24px;right:24px;bottom:calc(48px + env(safe-area-inset-bottom));text-align:center;color:rgba(255,255,255,.72);font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.5;opacity:0;transition:opacity .4s ease}
#haven-splash .hs-note.hs-show{opacity:1}
#haven-splash .hs-line{width:28px;height:3px;border-radius:2px;background:#F59E0B;margin-top:14px;transform:scaleX(0);animation:hsLine .8s cubic-bezier(.2,.7,.2,1) .3s forwards}
@keyframes hsIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes hsLine{to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){#haven-splash .hs-mark,#haven-splash .hs-line{animation:none;opacity:1;transform:none}#haven-splash{transition:none}}

/* Hides the splash. Called by the app right after its first screen is
   drawn (and by its error screen). The app is usable at once: the splash
   stops taking touches the moment the fade starts, and is removed after it.
   Reduce Motion: no fade, it is removed at once. Holds through any slow
   connection: there is no timeout that reveals a half-loaded app. */
(function(){
  var done=false;
  function hide(){
    var el=document.getElementById("haven-splash");
    if(done||!el) return; done=true;
    try{ performance.mark("haven-splash-hide"); }catch(e){}
    var still=false; try{ still=window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
    el.classList.add("hs-out");
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); try{ performance.mark("haven-splash-removed"); }catch(e){} }, still?0:320);
  }
  window.havenHideSplash=hide;
  // The splash is the loading screen: nothing hides it except the app.
  // A slow load gets a quiet note; files that fail to download get a clear
  // message instead of an endless splash.
  function note(text){
    var el=document.getElementById("haven-splash"); if(done||!el) return;
    var n=el.querySelector(".hs-note"); if(!n) return;
    n.textContent=text; n.classList.add("hs-show");
  }
  setTimeout(function(){ note("Still loading\u2026"); },10000);
  document.addEventListener("error",function(e){
    var t=e&&e.target; if(t&&t.tagName==="SCRIPT") note("Haven couldn't finish loading. Check your connection, then reopen the app.");
  },true);
})();
</script>
